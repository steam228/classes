name: Build and Deploy Documentation

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  repository_dispatch:
    types: [group-update]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zensical

      - name: Mint App token for the classroom org
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GALLERY_APP_ID }}
          private-key: ${{ secrets.GALLERY_APP_PRIVATE_KEY }}
          owner: ${{ vars.CLASSROOM_ORG }}
        continue-on-error: true

      - name: Fetch + regenerate student galleries
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLASSROOM_ORG: ${{ vars.CLASSROOM_ORG }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -n "$CLASSROOM_ORG" ]; then
            if ! python .github/scripts/fetch-galleries.py; then
              echo "::warning::Fetch failed — see error above. Falling back to --no-fetch so the deploy still goes through."
              python .github/scripts/fetch-galleries.py --no-fetch
            fi
          else
            echo "::warning::Gallery fetch skipped (App credentials or CLASSROOM_ORG not set); regenerating index from local content only"
            python .github/scripts/fetch-galleries.py --no-fetch
          fi

      - name: Build site
        run: zensical build --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "site"

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
