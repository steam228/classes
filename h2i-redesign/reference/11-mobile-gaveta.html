<style>
body{margin:0}
.h2i,.ty-A{--f-display:'Bricolage Grotesque','Helvetica Neue',Helvetica,sans-serif;--f-text:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'Atkinson Hyperlegible Mono',ui-monospace,'SF Mono',Menlo,monospace;--w-display:700;--ls-display:-0.025em}

.dots{background-image:radial-gradient(var(--h2i-dot) 1px,transparent 1.3px);background-size:16px 16px}
